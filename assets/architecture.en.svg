<rect class="k" x="762" y="260" width="576" height="190" rx="12"/>
<text class="t" x="780" y="284">Plugin · DrawGuessBridge.dll</text>
<rect class="b" x="780" y="296" width="540" height="42" rx="8"/><text class="s" x="796" y="322">BridgeServer · HTTP + WebSocket · 127.0.0.1:8765 · optional token</text>
<rect class="b" x="780" y="350" width="262" height="42" rx="8"/><text class="s" x="796" y="376">MainThreadDispatcher</text>
<rect class="b" x="1058" y="350" width="262" height="42" rx="8"/><text class="s" x="1074" y="376">StudioProcess (spawns :8770)</text>
<rect class="b" x="780" y="402" width="262" height="36" rx="8"/><text class="s" x="796" y="425">GameApi · LineInformation</text>
<rect class="b" x="1058" y="402" width="262" height="36" rx="8"/><text class="s" x="1074" y="425">Virtual pen · 9 virtual layers</text>
<rect class="b" x="762" y="470" width="576" height="68" rx="12"/>
<text class="t" x="780" y="496">Game modules</text><text class="s" x="780" y="518">DrawModule · SketchbookDrawModule · IngameDrawModule · DrawHelpers.SpawnDrawElement</text>
<rect class="b" x="762" y="554" width="576" height="68" rx="12"/>
<text class="t" x="780" y="580">Game canvas</text><text class="s" x="780" y="602">sorting &amp; undo stack · pressure (LinePressure) · multiplayer sync</text>
<rect class="b" x="762" y="638" width="576" height="138" rx="12" style="fill:#fafafe"/>
<text class="t" x="780" y="664">Why this is safe &amp; fast</text>
<text class="s" x="780" y="686">• no mouse emulation, no screen-recording or accessibility permission</text>
<text class="s" x="780" y="706">• all Unity access goes through the main-thread dispatcher</text>
<text class="s" x="780" y="726">• strokes enter the game's own undo / sync path</text>
<text class="s" x="780" y="746">• both servers bind to 127.0.0.1 only</text>
