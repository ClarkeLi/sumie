<rect class="b" x="40" y="70" width="420" height="92" rx="14"/>
<text class="t" x="60" y="102">Browser · Studio UI (ui.html)</text>
<text class="s" x="60" y="126">paste image · pick style · preview · draw · 5 languages</text>
<text class="s" x="60" y="146">served by the plugin at http://127.0.0.1:8765/</text>
<rect class="b" x="500" y="70" width="300" height="92" rx="14"/>
<text class="t" x="520" y="102">CLI / SDK</text>
<text class="s" x="520" y="126">dg_artist.py · dg_bridge.py</text>
<text class="s" x="520" y="146">scripts &amp; automation</text>

<rect x="40" y="214" width="660" height="576" rx="18" fill="#efeaf9" stroke="#b9aee0" stroke-width="1.6"/>
<text class="t" x="62" y="244" style="font-size:19px">Python Studio service · 127.0.0.1:8770</text>
<rect class="b" x="62" y="260" width="616" height="58" rx="10"/>
<text class="t" x="80" y="284">studio_server.py</text><text class="s" x="80" y="304">single-worker job queue · progress · preview · metrics · cancel</text>
<rect class="b" x="62" y="334" width="616" height="62" rx="10"/>
<text class="t" x="80" y="358">① Perception</text><text class="s" x="80" y="379">Anime2Sketch line art · anime-seg subject mask · palette · frame-cut softening</text>
<rect class="b" x="62" y="412" width="616" height="62" rx="10"/>
<text class="t" x="80" y="436">② Planner · anime_human</text><text class="s" x="80" y="457">line art → flat colours → shading → details · time budget (pacing.py)</text>
<rect class="k" x="62" y="490" width="616" height="84" rx="10"/>
<text class="t" x="80" y="514">③ Human model</text>
<text class="s" x="80" y="535">motor.py: Quick, Draw! rhythm &amp; pen-pressure pipeline · bucket.py: offline leak model</text>
<text class="s" x="80" y="555">brush_fill.py: layered brush colouring · layers.py: virtual-layer roles</text>
<rect class="b" x="62" y="590" width="616" height="62" rx="10"/>
<text class="t" x="80" y="614">④ Executor</text><text class="s" x="80" y="635">stroke-by-stroke with timing &amp; pressure · compresses pace to the round deadline</text>
<rect class="b" x="62" y="668" width="616" height="108" rx="10" style="fill:#fafafe"/>
<text class="t" x="80" y="692">Data flow</text>
<text class="s" x="80" y="714">image + options → plan.json (ops: line / disc / fill, normalised, y-up)</text>
<text class="s" x="80" y="734">plan → preview PNG + numeric metrics (coverage, colour error, ETA)</text>
<text class="s" x="80" y="754">plan → strokes → HTTP → plugin → game canvas</text>
