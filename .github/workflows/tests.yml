name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core dependencies
        run: python -m pip install -r client/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests
      - name: Dry-run the renderer on the sample image
        run: python client/dg_artist.py examples/sample.png --style anime_study --time 60 --dry-run --plan-out check.json
